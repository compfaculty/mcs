[package]
name = "mcs-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mcs-core = { path = "../mcs-core" }
ratatui = "0.30"
crossterm = "0.29"
mcs-viewer = { path = "../mcs-viewer" }
mcs-media = { path = "../mcs-media" }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }

[target.'cfg(unix)'.dependencies]
mio = { version = "1.2", features = ["os-poll", "os-ext"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
portable-pty = "0.9"
vt100 = "0.16"
nix = { version = "0.28", features = ["signal", "process", "fs"] }
